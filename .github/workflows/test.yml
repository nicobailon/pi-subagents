name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-shards:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        category: [unit, integration]
        shard: [1, 2, 3, 4]
        exclude:
          - category: unit
            shard: 4
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        if: matrix.category == 'unit' && matrix.shard == 2
        run: npm run typecheck
      - name: CI routing checks
        if: matrix.category == 'unit' && matrix.shard == 2
        run: node --test test/support/ci-shards-checks.mjs
      - name: Test shard (two isolated file processes)
        timeout-minutes: ${{ matrix.category == 'integration' && 10 || 20 }}
        run: node test/support/ci-shards.mjs run ${{ matrix.category }} ${{ matrix.shard }} ci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.os }}-${{ matrix.category }}-${{ matrix.shard }}
          path: ci-results/
          if-no-files-found: error

  # Preserve branch-protection names: test (ubuntu-latest), test (windows-latest).
  # Both gates deliberately wait for and require the entire producer matrix.
  test:
    needs: test-shards
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: test-${{ matrix.os }}-*
          path: ci-results
          merge-multiple: true
      - name: Require every successful shard and exact file coverage
        run: node test/support/ci-shards.mjs aggregate ci-results ${{ runner.os == 'Windows' && 'win32' || 'linux' }} "${{ needs.test-shards.result }}"

  bun-workflow-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: WorkflowScript Bun parity tests
        run: >-
          bun test test/unit/scripted-workflow.test.ts
          --test-name-pattern "portable workflow parity|regex literals|template expressions|portable plain helper|nested plain helper|unawaited child launch|unawaited runs.all|directly returned runs.run|docs-style awaited|awaited native Promise|Promise.resolve|Promise.all|then chain|new Promise wrapper"

  pi085-clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
      - name: Real Pi 0.85.0 background child smoke
        run: node --experimental-strip-types test/smoke/pi085-clean-install.mjs "${{ runner.temp }}/pi085-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi085-smoke-logs
          path: |
            ${{ runner.temp }}/pi085-smoke/*.log
            ${{ runner.temp }}/pi085-smoke/aliases.json
            ${{ runner.temp }}/pi085-smoke/host/package-lock.json
            ${{ runner.temp }}/pi085-smoke/extension/package-lock.json
