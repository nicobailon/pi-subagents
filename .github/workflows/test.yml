name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Temporary Windows isolated control for issue 1906
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
        run: |
          node -e 'console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,commit:process.env.GITHUB_SHA,runnerOS:process.env.RUNNER_OS,runnerArch:process.env.RUNNER_ARCH,imageOS:process.env.ImageOS,imageVersion:process.env.ImageVersion}))'
          Write-Output "Checkout commit: $(git rev-parse HEAD)"
          node --experimental-strip-types --import ./test/support/register-loader.mjs --test --test-name-pattern='does not use shared-cwd sibling tracked edits as parallel completion-guard proof' test/integration/async-execution.part-3.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests
        timeout-minutes: 10
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
        run: npm run test:integration

  bun-workflow-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: WorkflowScript Bun parity tests
        run: >-
          bun test test/unit/scripted-workflow.test.ts
          --test-name-pattern "portable workflow parity|regex literals|template expressions|portable plain helper|nested plain helper|unawaited child launch|unawaited runs.all|directly returned runs.run|docs-style awaited|awaited native Promise|Promise.resolve|Promise.all|then chain|new Promise wrapper"

  pi085-clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
      - name: Real Pi 0.85.0 background child smoke
        run: node --experimental-strip-types test/smoke/pi085-clean-install.mjs "${{ runner.temp }}/pi0850-smoke" 0.85.0
      - name: Real Pi 0.85.1 background child smoke
        run: node --experimental-strip-types test/smoke/pi085-clean-install.mjs "${{ runner.temp }}/pi0851-smoke" 0.85.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi085-smoke-logs
          path: |
            ${{ runner.temp }}/pi0850-smoke/*.log
            ${{ runner.temp }}/pi0850-smoke/aliases.json
            ${{ runner.temp }}/pi0850-smoke/host/package-lock.json
            ${{ runner.temp }}/pi0850-smoke/extension/package-lock.json
            ${{ runner.temp }}/pi0851-smoke/*.log
            ${{ runner.temp }}/pi0851-smoke/aliases.json
            ${{ runner.temp }}/pi0851-smoke/host/package-lock.json
            ${{ runner.temp }}/pi0851-smoke/extension/package-lock.json
