name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: node --experimental-strip-types --import ./test/support/isolated-temp-root.mjs --test ${{ runner.os == 'Windows' && '--test-concurrency=2' || '' }} test/unit/*.test.ts
      - name: Integration tests
        timeout-minutes: 10
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
          PI_SUBAGENTS_TERMINAL_EVIDENCE_DIR: ${{ runner.temp }}/1906-terminal-evidence
        run: node --experimental-strip-types --import ./test/support/register-loader.mjs --test ${{ runner.os == 'Windows' && '--test-concurrency=2' || '' }} test/integration/*.test.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shared-cwd-terminal-${{ matrix.os }}
          path: ${{ runner.temp }}/1906-terminal-evidence/shared-cwd-terminal.json
          if-no-files-found: ignore

  bun-workflow-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: WorkflowScript Bun parity tests
        run: >-
          bun test test/unit/scripted-workflow.test.ts
          --test-name-pattern "portable workflow parity|regex literals|template expressions|portable plain helper|nested plain helper|unawaited child launch|unawaited runs.all|directly returned runs.run|docs-style awaited|awaited native Promise|Promise.resolve|Promise.all|then chain|new Promise wrapper"

  pi085-clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
      - name: Real Pi 0.85.0 background child smoke
        run: node --experimental-strip-types test/smoke/pi085-clean-install.mjs "${{ runner.temp }}/pi0850-smoke" 0.85.0
      - name: Real Pi 0.85.1 background child smoke
        run: node --experimental-strip-types test/smoke/pi085-clean-install.mjs "${{ runner.temp }}/pi0851-smoke" 0.85.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi085-smoke-logs
          path: |
            ${{ runner.temp }}/pi0850-smoke/*.log
            ${{ runner.temp }}/pi0850-smoke/aliases.json
            ${{ runner.temp }}/pi0850-smoke/host/package-lock.json
            ${{ runner.temp }}/pi0850-smoke/extension/package-lock.json
            ${{ runner.temp }}/pi0851-smoke/*.log
            ${{ runner.temp }}/pi0851-smoke/aliases.json
            ${{ runner.temp }}/pi0851-smoke/host/package-lock.json
            ${{ runner.temp }}/pi0851-smoke/extension/package-lock.json

  official-standalone:
    # The official Linux x64 release only; 22.04 permits bubblewrap namespaces.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install controller dependencies and isolation tool
        run: |
          node -e 'const a = require("node:assert/strict"); a.equal(process.platform, "linux"); a.equal(process.arch, "x64");'
          npm ci --ignore-scripts
          # Bubblewrap needs only Ubuntu indexes, not the runner's third-party repositories.
          printf '%s\n' 'deb http://archive.ubuntu.com/ubuntu jammy main universe' 'deb http://archive.ubuntu.com/ubuntu jammy-updates main universe' 'deb http://security.ubuntu.com/ubuntu jammy-security main universe' > "$RUNNER_TEMP/ubuntu.sources.list"
          sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/ubuntu.sources.list" -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/ubuntu.sources.list" -o Dir::Etc::sourceparts=- install -y bubblewrap
      - name: Provision the checksum-pinned official binary
        shell: bash
        run: |
          set -euo pipefail
          url="$(node -p 'require("./test/smoke/standalone-release.json").url')"
          sha="$(node -p 'require("./test/smoke/standalone-release.json").archiveSha256')"
          mkdir -p "$RUNNER_TEMP/pi-official"
          curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/pi-official/release.tar.gz"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/pi-official/release.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/pi-official/release.tar.gz" -C "$RUNNER_TEMP/pi-official"
      - name: Complete isolated official binary matrix
        run: node test/smoke/standalone-matrix.mjs "$RUNNER_TEMP/pi-official/pi/pi" "$RUNNER_TEMP/standalone-matrix"
      - name: Provision npm host for public launch regression
        run: node test/smoke/pi085-clean-install.mjs "$RUNNER_TEMP/npm-background-sdk" 0.85.1
      - name: Isolated real npm public launch
        run: node test/smoke/npm-background.mjs "$RUNNER_TEMP/npm-background-sdk" "$RUNNER_TEMP/npm-background"
      - name: Require completed Linux smoke receipts
        run: |
          node -e 'const a = require("node:assert/strict"); const r = require(process.env.RUNNER_TEMP + "/standalone-matrix/matrix.json"); a.equal(r.complete, true); a.equal(r.cases.length, 18); a.ok(r.cases.every(c => c.exitCode === 0 && !c.error));'
          node -e 'const a = require("node:assert/strict"); const r = require(process.env.RUNNER_TEMP + "/npm-background/npm-launch.json"); a.equal(r.publicLaunch, true); a.equal(r.runtime, "Node"); a.equal(r.version, "0.85.1"); a.equal(r.network, "unshared");'
      - name: Collect bounded lifecycle evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/standalone-matrix"
          find . -type d \( -name package -o -name cache -o -name bun-cache -o -name home -o -name agent -o -name assets -o -name theme -o -name export-html \) -prune -o -type f \( -name '*.log' -o -name '*.jsonl' -o -name status.json -o -name process-terminal.json -o -name identity.json -o -name '*result.json' -o -name '*notification*.json' -o -name '*witness.json' -o -name '*competition.json' -o -name launch.json -o -name '*failure.json' -o -name launch-error.json \) -print0 > "$RUNNER_TEMP/standalone-files"
          tar --null -czf "$RUNNER_TEMP/standalone-evidence.tar.gz" --files-from "$RUNNER_TEMP/standalone-files"
          test "$(stat -c %s "$RUNNER_TEMP/standalone-evidence.tar.gz")" -le 33554432
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-standalone-receipt
          path: |
            ${{ runner.temp }}/standalone-matrix/matrix.json
            ${{ runner.temp }}/standalone-matrix/inputs.json
            ${{ runner.temp }}/npm-background/parent.log
            ${{ runner.temp }}/npm-background/npm-launch.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: official-standalone-lifecycle
          path: ${{ runner.temp }}/standalone-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7
